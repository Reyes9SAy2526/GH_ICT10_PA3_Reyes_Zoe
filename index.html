
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Participation Activity 3</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e40af, #38bdf8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            border-top: 6px solid #38bdf8;
        }

        h2 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        input[type="button"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
        }

        input[type="button"]:hover {
            background: linear-gradient(135deg, #1d4ed8, #0369a1);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
        }

        input[type="button"]:active {
            transform: scale(0.98);
        }

        #results {
            margin-top: 22px;
            padding: 16px;
            background-color: #eff6ff;
            border: 1px solid #dbeafe;
            border-left: 5px solid #2563eb;
            border-radius: 10px;
            color: #1e3a8a;
            font-size: 15px;
            line-height: 1.7;
            overflow-wrap: anywhere;
            text-align: left;
            min-height: 10px;
        }

        form {
            width: 100%;
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                padding: 28px 22px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🌎 Country & Capital</h2>
        <p>Discover the capital city of a country. Enter a country name below to get started!</p>

        <form onsubmit="return false;">
            <input
                type="text"
                id="input1"
                placeholder="Enter the country"
            >

            <input
                type="button"
                py-click="countries_capital"
                value="Search Country"
            >
        </form>

        <div id="results"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
